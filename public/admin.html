<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin</title><link rel="stylesheet" href="/styles.css"><style>.wrap{max-width:900px;margin:30px auto;padding:0 18px}.box{background:white;border:1px solid #e5e7eb;border-radius:14px;padding:25px;margin:18px 0}input{width:100%;padding:11px;margin:5px 0 14px;border:1px solid #d0d5dd;border-radius:8px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.msg{color:#667085;margin-top:10px}.row{padding:12px 0;border-bottom:1px solid #e5e7eb}.actions{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.secondary{background:#eef0f3;color:#20242a}@media(max-width:700px){.formgrid{grid-template-columns:1fr}}</style></head><body><header><b>Fundraising Admin</b><a href="/">View website</a></header><main class=wrap><div id=login class=box><h2>Admin Login</h2><input id=pw type=password placeholder="Admin password"><button onclick=login()>Sign in</button><div id=loginmsg class=msg></div></div><div id=panel style="display:none"><div class=box><h2>Patient & Treatment</h2><div class=formgrid><label>Patient Name<input id=patientName></label><label>Disease<input id=disease></label><label>Hospital<input id=hospital></label><label>Hepatologist<input id=hepatologist></label><label>Oncologist<input id=oncologist></label><label>Treatment<input id=treatment></label><label>Protocol<input id=protocol></label><label>Injection<input id=injections></label><label>Tremelimumab Cost<input id=tremelimumabCost></label><label>Durvalumab Cost<input id=durvalumabCost></label><label>Duration<input id=duration></label></div><button onclick=saveDetails()>Save Details</button><div id=savemsg class=msg></div></div><div class=box><h2>QR Code</h2><input id=qrfile type=file accept="image/png,image/jpeg,image/webp"><button onclick=qrup()>Upload / Replace QR</button><div id=qrmsg class=msg></div></div><div class=box><h2>Bank Details</h2><div class=formgrid><label>Account Name<input id=accountName></label><label>Account Number<input id=accountNumber></label><label>IFSC<input id=ifsc></label><label>Bank Name<input id=bankName></label><label>Branch<input id=branch></label></div><button onclick=bankup()>Save Bank Details</button><div id=bankmsg class=msg></div></div><div class=box><h2>Medical Documents / Private Drop Box</h2><p class=msg><b>Private by default.</b> A document becomes visible on the public site only after you choose Make Public.</p><input id=docfile type=file accept="application/pdf,image/png,image/jpeg,image/webp"><button onclick=docup()>Add Document</button><div id=docmsg class=msg></div><div id=list></div></div><div class=box><button class=secondary onclick=logout()>Sign out</button></div></div></main><script src=/admin.js></script></body></html>
